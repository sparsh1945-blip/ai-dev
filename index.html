<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Downloader</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
  .card {
    background: #1e293b;
    padding: 2.5rem;
    border-radius: 16px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  h1 { margin-top: 0; font-size: 1.5rem; text-align: center; }
  input[type="text"] {
    width: 100%;
    padding: 0.75rem;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 1rem;
    margin-top: 1rem;
  }
  .formats {
    display: flex;
    gap: 0.75rem;
    margin-top: 1rem;
  }
  .formats label {
    flex: 1;
    text-align: center;
    padding: 0.6rem;
    border-radius: 8px;
    border: 1px solid #334155;
    cursor: pointer;
    user-select: none;
  }
  .formats input { display: none; }
  .formats input:checked + span {
    color: #38bdf8;
    font-weight: 600;
  }
  .formats label:has(input:checked) {
    border-color: #38bdf8;
    background: rgba(56,189,248,0.08);
  }
  button {
    width: 100%;
    margin-top: 1.25rem;
    padding: 0.8rem;
    border: none;
    border-radius: 8px;
    background: #38bdf8;
    color: #0f172a;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #status { margin-top: 1rem; font-size: 0.9rem; text-align: center; min-height: 1.2em; }
  .error { color: #f87171; }
  .ok { color: #4ade80; }
</style>
</head>
<body>
  <div class="card">
    <h1>🎬 YouTube Downloader</h1>
    <form id="form">
      <input type="text" id="url" name="url" placeholder="Paste YouTube URL here" required>
      <div class="formats">
        <label><input type="radio" name="format" value="mp3" checked><span>🎵 MP3</span></label>
        <label><input type="radio" name="format" value="mp4"><span>🎥 MP4</span></label>
      </div>
      <button type="submit" id="btn">Download</button>
    </form>
    <div id="status"></div>
  </div>

<script>
const form = document.getElementById("form");
const btn = document.getElementById("btn");
const status = document.getElementById("status");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const url = document.getElementById("url").value.trim();
  const format = form.format.value;

  btn.disabled = true;
  btn.textContent = "Downloading...";
  status.textContent = "Processing, this can take a moment...";
  status.className = "";

  try {
    const resp = await fetch("/download", {
      method: "POST",
      body: new URLSearchParams({ url, format })
    });

    if (!resp.ok) {
      const data = await resp.json();
      throw new Error(data.error || "Download failed.");
    }

    const blob = await resp.blob();
    const disposition = resp.headers.get("Content-Disposition") || "";
    const match = disposition.match(/filename="?([^"]+)"?/);
    const filename = match ? match[1] : `download.${format}`;

    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();

    status.textContent = "Done! Check your downloads.";
    status.className = "ok";
  } catch (err) {
    status.textContent = err.message;
    status.className = "error";
  } finally {
    btn.disabled = false;
    btn.textContent = "Download";
  }
});
</script>
</body>
</html>
